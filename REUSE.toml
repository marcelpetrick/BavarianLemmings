version = 1

# Files that cannot carry a comment header.
[[annotations]]
path = ["**.md", "package.json", "package-lock.json", "tsconfig.json", ".prettierrc.json", "LICENSE", "assets/**.json", "src/**.json", "docs/screenshots/**", "docs/*.png", ".claude/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Marcel Petrick <mail@marcelpetrick.it>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Voice lines generated by us with scripts/generate-voices.sh (espeak-ng); WAV files cannot carry a header.
[[annotations]]
path = ["public/audio/voices/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Marcel Petrick <mail@marcelpetrick.it>"
SPDX-License-Identifier = "GPL-3.0-or-later"
