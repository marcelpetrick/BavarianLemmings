# nginx site for the static BavarianLemmings build (Dockerfile, stage 2).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml audio/wav;
    gzip_min_length 1024;

    # Vite puts a content hash into every file name under assets/, so they never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The stock mime.types has no .wav entry. Browsers need audio/wav to decode the voice lines.
    # An empty types block plus default_type sets it here without dropping the inherited MIME map.
    location ~ \.wav$ {
        types { }
        default_type audio/wav;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # index.html names the current hashed assets, so the browser must revalidate it every time.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
