#
# CI mirrors the local quality gate: it runs exactly ./localPipeline.sh --noRun, nothing more
# (with BL_DOCKER=1, so the Docker smoke test runs too).
# The only extra is a cache for the Playwright browsers, so they are not downloaded on every run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Local pipeline
        run: ./localPipeline.sh --noRun
        env:
          # Includes the Docker smoke test (scripts/docker-smoke.sh); the runner has docker.
          BL_DOCKER: '1'
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
